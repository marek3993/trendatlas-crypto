name: MRV1 App Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "20 1 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify existing Python
        shell: powershell
        run: |
          $python = (Get-Command python -ErrorAction Stop).Source
          Write-Host "Using python at $python"
          python --version
          python -c "import sys; print(sys.executable)"

      - name: Install dependencies
        shell: powershell
        run: |
          python --version
          python -m pip --version
          python -m pip install --user requests pandas
          if (Test-Path requirements.txt) {
            python -m pip install --user -r requirements.txt
          }

      - name: Run safe authority producer default
        run: |
          python ./scripts/execution/run_pi_authoritative_producer.py

      - name: Verify workflow did not stage generated outputs
        run: |
          git status --short
