name: MRV1 App Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "20 1 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify existing Python
        shell: powershell
        run: |
          $python = (Get-Command python -ErrorAction Stop).Source
          Write-Host "Using python at $python"
          python --version
          python -c "import sys; print(sys.executable)"

      - name: Install dependencies
        shell: powershell
        run: |
          python --version
          python -m pip --version
          python -m pip install --user requests pandas
          if (Test-Path requirements.txt) {
            python -m pip install --user -r requirements.txt
          }

      - name: Run app refresh pipeline
        run: |
          python ./scripts/daily_refresh_app_pipeline.py

      - name: Commit refreshed outputs
        shell: python
        run: |
          import subprocess

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(
              ["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"],
              check=True,
          )
          for path in [
              "data/ohlcv",
              "data/macro/global_liquidity_weekly.csv",
              "outputs/phase67j_final_narrow_validation_pack",
              "outputs/phase66g_production_candidate_live",
              "outputs/phase67b_top100_forensic_prune_and_rerun",
              "outputs/app_freshness_verification",
              "outputs/app_refresh_pipeline",
          ]:
              subprocess.run(["git", "add", path], check=True)

          diff_result = subprocess.run(["git", "diff", "--cached", "--quiet"], check=False)
          if diff_result.returncode == 1:
              subprocess.run(["git", "commit", "-m", "Auto refresh app data"], check=True)
          elif diff_result.returncode != 0:
              raise SystemExit(diff_result.returncode)

      - name: Push changes
        run: |
          git push origin main
