name: MRV1 App Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "20 1 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests pandas

      - name: Run app refresh pipeline
        run: |
          python ./scripts/daily_refresh_app_pipeline.py

      - name: Commit refreshed outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ohlcv
          git add data/macro/global_liquidity_weekly.csv
          git add outputs/phase67j_final_narrow_validation_pack
          git add outputs/phase66g_production_candidate_live
          git add outputs/phase67b_top100_forensic_prune_and_rerun
          git add outputs/app_freshness_verification
          git add outputs/app_refresh_pipeline
          git diff --cached --quiet || git commit -m "Auto refresh app data"

      - name: Push changes
        run: |
          git push origin main