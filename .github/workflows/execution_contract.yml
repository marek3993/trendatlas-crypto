name: Production execution contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_exchange_support:
        description: Validate the checked-out Production Core against current exchange metadata before deployment
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt numpy requests
      - run: python -m unittest tests.test_dynamic_execution_source_contract tests.test_execution_public_state_separation tests.test_dependency_scoped_watchdog tests.test_dashboard_public_contract_materializer tests.test_execution_chain_sync tests.test_production_execution -q
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web

  verify-exchange-before-deployment:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_exchange_support
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Verify strategy assets with current read-only exchange metadata
        run: npm run production:check-asset-support
        working-directory: web
